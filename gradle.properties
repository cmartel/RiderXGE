# --- Plugin coordinates ---
pluginGroup = org.riderxge
pluginName = IncrediBuild Integration
pluginVersion = 0.1.8

# Oldest supported Rider; the plugin is compiled against it (Java 21 bytecode) and verified against newer lines too
# (downloaded from JetBrains unless riderLocalPath is set).
platformVersion = 2024.3.3
# Optional: path to a locally installed Rider. When set, no IDE download is needed.
# Override with -PriderLocalPath=... or leave empty to download `platformVersion` from JetBrains.
riderLocalPath = C:/Program Files/JetBrains/JetBrains Rider 2024.3.3

pluginSinceBuild = 243

# Content modules to compile against (comma separated). Empty for Rider 2024.3.
riderBundledModules =
pluginUntilBuild =

org.gradle.jvmargs = -Xmx2g
org.gradle.caching = true
org.gradle.configuration-cache = false
kotlin.stdlib.default.dependency = false
